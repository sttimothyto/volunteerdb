services:
  db:
    image: docker.io/library/postgres:17
    # Deliberately untuned. Production's settings live in siteconf.PG_TUNING
    # and are sized for a >=4 GB server shared with the app container —
    # 512 MB of shared_buffers is the wrong answer on a laptop, and buys
    # nothing against a seeded demo database. Keeping the two in step by
    # comment was a standing invitation to drift.
    environment:
      POSTGRES_USER: volunteerdb
      # The :-volunteerdb fallback does NOT save you here: podman-compose
      # (1.3.0) skips interpolation when the variable name matches the key it
      # is assigned to, and writes this literal string in as the password —
      # baking it into the data volume on first start. POSTGRES_PASSWORD must
      # really be set; .env.example sets it and `make db` writes .env first.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volunteerdb}
      POSTGRES_DB: volunteerdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteerdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    profiles: ["app"]
    build: .
    environment:
      # NOT a copy of the VDB_DATABASE_URL in .env / config.py: this one names
      # `db`, the service's hostname on the compose network, where those name
      # localhost. It has to be spelled out here for the same reason.
      VDB_DATABASE_URL: postgresql+asyncpg://volunteerdb:${POSTGRES_PASSWORD:-volunteerdb}@db:5432/volunteerdb
      # Empty is valid (a random per-boot secret; sessions reset on restart),
      # so this must not be `:?` — that rejects empty as well as unset, and
      # compose interpolates every service before starting the one you asked
      # for, which made an empty secret block even `up -d db`.
      VDB_STORAGE_SECRET: ${VDB_STORAGE_SECRET-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
