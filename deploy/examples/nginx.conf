# nginx equivalent of the Caddy block, for a server that already runs nginx.
# Set [proxy] caddy = false in your site file; the deploy then leaves TLS and
# the proxy entirely to you. Substitute:
#
#   vdb.example.org   -> [host] domain      in deploy/sites/<yours>.toml
#   127.0.0.1:8090    -> [host] listen_port in the same file
#
# Certificates are yours to obtain and renew (certbot, or your provider's).
#
# Two lines are load-bearing, not cosmetic:
#   - the Upgrade/Connection headers: the app is NiceGUI, which keeps a
#     WebSocket open per page. Caddy's reverse_proxy does this implicitly;
#     nginx does not, and without it every page loads and then hangs.
#   - X-Forwarded-Proto https: FORWARDED_ALLOW_IPS=* in the app's env file
#     trusts it, and it is how emailed links (invitations, sign-in codes)
#     come out https:// rather than http://.

server {
    listen 80;
    listen [::]:80;
    server_name vdb.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vdb.example.org;

    ssl_certificate     /etc/letsencrypt/live/vdb.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vdb.example.org/privkey.pem;

    # The app serves nothing compressed itself - including the full volunteers
    # table and the public ministry pages.
    gzip on;
    gzip_types text/plain text/css text/csv text/calendar application/json
               application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A page's WebSocket stays open for as long as the tab does.
        proxy_read_timeout 3600;
    }
}
