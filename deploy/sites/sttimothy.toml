# St. Timothy Parish, Toronto — the instance at https://vdb.sttimothyto.org.
#
# Every value the deploy needs that is specific to this parish. Anything not
# here is the same on every instance and lives in deploy/siteconf.py.
# Secrets are NOT here: the deploy generates them on first run and reads them
# back from /etc/volunteerdb/env afterwards (see deploy/steps/secrets.py).
#
# Per-key reference: docs/reference/site-config.md

[site]
name = "sttimothy"        # must equal this file's name
org_name = "St. Timothy's"
timezone = "America/Toronto"

[host]
ssh_host = "sttimothyto-prod"
ssh_user = "root"
public_ip = "91.99.133.210"
domain = "vdb.sttimothyto.org"
listen_port = 8090

[mail]
from_address = "no-reply@sttimothyto.org"
from_name = "VolunteerDB"
admin_email = "admin@sttimothyto.org"
alert_email = "admin@sttimothyto.org"
contact_email = "admin@sttimothyto.org"

[backup]
rclone_remote = "volunteerdb-gdrive-backup"
retain_local_days = 14
retain_remote_days = 730

[sheets]
# Drive folder id new roster sheets are created in -- the same
# volunteerdb-spreadsheets folder the retired rclone sync used, so new sheets
# land beside the 67 that are already there. The OAuth credentials that go with
# it are secrets, kept in the remote env file (see deploy/steps/secrets).
folder_id = "1-YTh3Edj-s8fk7l7q9t9gn7sPlYanYPf"

[schedule]
# Parish-local (see [site] timezone). The backup runs first so its dump is a
# restore point taken immediately before the roster sync, the only automated
# bulk write in the system. The other in-app jobs are kept clear of both.
backup_at = "02:00"
roster_sync_at = "02:30"
fetch_pages_at = "03:00"
proposal_digest_at = "03:30"
event_reminders_at = "04:00"
