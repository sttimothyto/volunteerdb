# Template for a new instance. Copy to deploy/sites/<yourname>.toml, fill in
# every value, and commit it — then deploy with `make deploy SITE=<yourname>`.
#
# The walkthrough that puts this in order (DNS, the reverse proxy, mail,
# Google Drive, the first deploy) is docs/how-to/new-instance.md. The per-key
# reference is docs/reference/site-config.md.
#
# No secrets belong in this file. The deploy generates the session secret and
# the database password on its first run and reads them back from
# /etc/volunteerdb/env on every run after that; the mail API key is passed on
# the command line once. Nothing here is sensitive, which is why it is
# committed.

[site]
# Must equal this file's name, so that SITE=x always deploys x.
name = "example"
# Appears in outbound mail: "Your VolunteerDB account at <org_name>". Write it
# the way you would say it — "St. Peter's", "Holy Family Parish".
org_name = "Example Parish"
# IANA zone. Election deadlines and event reminders mean "through the end of
# that day HERE", and the nightly systemd timers fire on this zone too.
timezone = "America/Toronto"

[host]
# How pyinfra reaches the server: an ssh_config alias, a hostname, or an IP.
ssh_host = "example-prod"
# The deploy installs packages and writes to /etc, so it needs root.
ssh_user = "root"
# The server's public address. With [proxy] caddy = true the deploy refuses to
# touch Caddy until `domain` resolves to it; nothing else reads it.
public_ip = "203.0.113.10"
# Public hostname. Caddy serves TLS for it; the app builds email links from it.
domain = "vdb.example.org"
# Host loopback port the app publishes on, and that the reverse proxy sends
# to. Change it only if something else on the box already uses it.
listen_port = 8090

[proxy]
# true:  the deploy installs Caddy from its upstream apt repository, OWNS
#        /etc/caddy/Caddyfile outright (a hand-written one is copied aside once
#        as Caddyfile.bak-pre-managed-<date>), validates it, opens http/https in
#        firewalld if that is running, and reloads Caddy. For a server whose
#        only public service is VolunteerDB, plus whatever you put in `extra`.
#        Assumes the server sits on its own public address (any VPS): the
#        deploy checks that `domain` resolves to `public_ip` before touching
#        Caddy, then fetches https://<domain>/login from the server itself.
# false: the deploy never touches Caddy or the firewall. Terminate TLS yourself
#        from deploy/examples/Caddyfile or deploy/examples/nginx.conf.
caddy = true
# Verbatim Caddyfile text appended after the VolunteerDB site block: other
# sites this Caddy should keep serving. Ignored when caddy = false. For more
# than one line use a multi-line literal string:
#   extra = '''
#   www.example.org, example.org {
#       redir https://new.example.org/ permanent
#   }
#   '''
extra = ""

[mail]
# MUST be on a domain your mail provider is authorised to send for, or
# delivery simply fails. Leaving another parish's address here is the single
# most likely reason a new instance sends nothing.
from_address = "no-reply@example.org"
from_name = "VolunteerDB"
# The administrator account the deploy bootstraps, and the only way into a
# fresh instance — pass VDB_ADMIN_PASSWORD on the first deploy.
admin_email = "admin@example.org"
# Where a failed backup or a failed scheduled job (roster or calendar sync,
# digests, reminders) reports.
# Point it at a mailbox a human actually reads; "" disables the emails.
alert_email = "admin@example.org"
# Shown in the footer of the built manual ("report it to ..."). Baked in at
# image build time, so changing it needs a redeploy.
contact_email = "admin@example.org"

[backup]
# Name of the rclone remote you provision by hand (docs/how-to/backup-restore.md).
# The encrypting wrapper is this name + "-crypt"; the deploy asserts both exist.
# "none" keeps the nightly dumps on this server ONLY -- no off-site copy, so a
# lost disk loses the database and its backups together, and the deploy says
# so on every run. Provisioning Drive is strongly recommended.
rclone_remote = "volunteerdb-gdrive-backup"
# Plaintext dumps kept on the server; root-only, on the same host as the live
# database.
retain_local_days = 14
# Encrypted copies kept on Drive (ignored with rclone_remote = "none").
retain_remote_days = 730

[sheets]
# Drive folder id new roster sheets are created in (the folder's id, from its
# URL -- not its name: the app addresses it through the Drive API). The OAuth
# credentials that go with it are secrets and live in the remote env file.
folder_id = ""

[schedule]
# Parish-local times. Keep the ordering: the backup must precede the roster
# sync, so its dump is a restore point taken immediately before the only
# automated bulk write in the system, and the remaining in-app jobs must come
# after both. tests/test_deploy_config.py enforces that ordering.
backup_at = "02:00"
roster_sync_at = "02:30"
fetch_pages_at = "03:00"
proposal_digest_at = "03:30"
event_reminders_at = "04:00"
