name: CI

# Every push runs lint + tests + docs. A green push to main deploys, via the
# same pyinfra script used by hand (docs/how-to/deploy.md), from a clean
# checkout of that commit: the parish named by VDB_SITE, and -- if the
# repository also runs one -- the public demo named by VDB_DEMO_SITE. The two
# deploys are independent jobs in separate GitHub Environments.

on:
  push:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pyinfra --dry (preview only, changes nothing)"
        type: boolean
        default: false

# Superseded runs are cancelled on feature branches, but never on main: a
# second merge must not kill a pyinfra run half-applied.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      # `ty` over src/, held to the ceiling in scripts/typecheck.py -- the same
      # checker the editor runs, so a type error that is visible while writing
      # the code cannot reach main unnoticed. Over the ceiling, every
      # diagnostic is in the log.
      - name: ty check
        run: uv run python scripts/typecheck.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: volunteerdb
          POSTGRES_PASSWORD: volunteerdb
          POSTGRES_DB: volunteerdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volunteerdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Every setting in src/volunteerdb/config.py has a default, so no .env is
      # needed — only the database URL differs from the defaults.
      VDB_DATABASE_URL: postgresql+asyncpg://volunteerdb:volunteerdb@localhost:5432/volunteerdb
      # tests/conftest.py shells out to `uv run alembic upgrade head`; keep that
      # nested call from trying to re-resolve the lockfile.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # tests/e2e drives a real browser. --with-deps because a bare runner is
      # missing the shared libraries Chromium needs; only chromium, because
      # that is the only browser the suite launches.
      - name: install chromium
        run: uv run playwright install --with-deps chromium
      # Deliberately not setting VDB_TEST_ALLOW_NO_DB or
      # VDB_TEST_ALLOW_NO_BROWSER: a missing database or browser must fail the
      # run, not skip into a green one.
      # The pure tier needs no database or browser; it runs first because it
      # is the fast half of the signal, and separately so a regression in it
      # is named as one.
      - name: pytest (pure)
        run: uv run pytest -q -m pure
      # With coverage, and the floor in pyproject (tool.coverage.report
      # fail_under): a run that passes every test but leaves new code
      # untested fails here, and the missing lines are in the log.
      # -n 4 --dist loadgroup: a worker per runner core, each on its own
      # scratch database, with tests/e2e held together on one of them so the
      # browser session starts one app process. The pure tier above stays
      # serial -- it is ten seconds, and four workers cost more to start than
      # they save. pytest-cov combines the workers' data itself, so the floor
      # in pyproject still applies to the whole run.
      - name: pytest
        run: uv run pytest -q -n 4 --dist loadgroup --cov --cov-report=term-missing:skip-covered

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # The Containerfile's docs stage builds with -W, so a new sphinx warning
      # would otherwise fail the image build on the production host mid-deploy.
      - name: sphinx -W
        run: uv run --group docs sphinx-build -W -b html docs docs/_build/html
      # The chunker behind /manual/_search reads Furo's markup by its
      # <section id> and heading tags. If a theme or Sphinx upgrade changed
      # that, the search box would quietly find nothing; this prints the
      # page and section counts and fails below a floor. No model needed.
      - name: the search chunker still reads the built manual
        run: uv run python -m volunteerdb.manual_search docs/_build/html

  deploy:
    needs: [lint, test, docs]
    # Which deploy/sites/*.toml to deploy is the VDB_SITE *repository* variable
    # (Settings -> Secrets and variables -> Actions -> Variables). It cannot be
    # an environment variable: a job-level `if` is evaluated before the
    # environment is chosen, so those are invisible to it. A repository that
    # has not set one -- a fork, by default -- runs lint, the tests and the
    # docs build, and deploys nothing. The demo below is a second job with a
    # variable and an environment of its own.
    if: github.ref == 'refs/heads/main' && vars.VDB_SITE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      # Only the link GitHub shows beside the deployment; nothing reads it.
      # Taken from the site file below, so the domain is written once.
      url: ${{ steps.site.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Read the site file
        id: site
        env:
          VDB_SITE: ${{ vars.VDB_SITE }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import os, tomllib
          with open(f"deploy/sites/{os.environ['VDB_SITE']}.toml", "rb") as f:
              print(f"url=https://{tomllib.load(f)['host']['domain']}")
          EOF

      # Secrets go through env, never interpolated into the shell body: ${{ }}
      # expands before bash parses the script.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      # Pinned: an unpinned `uvx pyinfra` could take a new major into a
      # production deploy. The same pin is in the Makefile (`make deploy`), and
      # a test keeps the two equal. deploy.py smoke-tests /login itself and
      # exits non-zero if the app does not come back, so this step is the gate.
      - name: pyinfra deploy
        env:
          # Everything specific to this parish lives in deploy/sites/<VDB_SITE>.toml.
          VDB_SITE: ${{ vars.VDB_SITE }}
          # Overrides the site file's [host] ssh_host, which is an ssh_config
          # alias that means nothing on a runner. It also has to keep matching
          # whatever DEPLOY_KNOWN_HOSTS pins, so the two stay set together.
          # The ssh user still comes from the site file.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Unset expands to "" — falsy, so deploy.py keeps the key already on
          # the host. Setting it rotates the key.
          VDB_SMTP2GO_API_KEY: ${{ secrets.VDB_SMTP2GO_API_KEY }}
          MODE: ${{ inputs.dry_run && '--dry' || '-y' }}
        run: |
          uvx pyinfra==3.10.0 deploy/inventory.py deploy/deploy.py \
            --ssh-key ~/.ssh/id_deploy "$MODE"

  # The public demo, deployed from the same commit by the same script. Its
  # site file, its host and its GitHub Environment are its own, which is what
  # keeps the two apart: a demo carries no parish data and, below, no mail key.
  #
  # Independent of `deploy` rather than chained after it. The demo lives on a
  # shared host that other deploys reboot, so a demo that is down must not
  # hold the parish's release back, and a failure is named as the job it
  # happened in.
  deploy-demo:
    needs: [lint, test, docs]
    # A *repository* variable for the same reason as VDB_SITE above: a
    # job-level `if` is evaluated before the environment is chosen. A
    # repository that runs no demo -- a fork, or a parish with one instance --
    # leaves it unset, and deploys production alone.
    if: github.ref == 'refs/heads/main' && vars.VDB_DEMO_SITE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: demo
      url: ${{ steps.site.outputs.url }}
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Read the site file
        id: site
        env:
          VDB_SITE: ${{ vars.VDB_DEMO_SITE }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import os, tomllib
          with open(f"deploy/sites/{os.environ['VDB_SITE']}.toml", "rb") as f:
              print(f"url=https://{tomllib.load(f)['host']['domain']}")
          EOF

      # These three must be secrets of the `demo` Environment, not repository
      # secrets. Repository secrets are visible to both jobs, so a DEPLOY_HOST
      # set at that level would point this job at the production server and
      # install the demo over the parish.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      # No VDB_SMTP2GO_API_KEY and no VDB_ADMIN_PASSWORD: a public demo must
      # not be able to mail anybody, and its accounts come from
      # scripts/seed.py, which rewrites the database nightly on the host.
      # Otherwise the production job's step, pin included -- a test fails if
      # the two pins in this file disagree, or if either drifts from the
      # Makefile's.
      - name: pyinfra deploy
        env:
          VDB_SITE: ${{ vars.VDB_DEMO_SITE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          MODE: ${{ inputs.dry_run && '--dry' || '-y' }}
        run: |
          uvx pyinfra==3.10.0 deploy/inventory.py deploy/deploy.py \
            --ssh-key ~/.ssh/id_deploy "$MODE"
