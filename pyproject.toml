[project]
name = "volunteerdb"
version = "0.1.0"
description = "Church volunteer/ministry database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "nicegui>=3.14.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
]

[project.scripts]
volunteerdb = "volunteerdb.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]
docs = [
    "sphinx>=9.1",
    "myst-parser>=5.0",
    "furo>=2025.12",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
# Ruff's default width, stated explicitly so it cannot drift under us. The
# source is formatted to it -- run `make format` rather than rewrapping by hand.
line-length = 88
extend-exclude = ["ingest-data"]  # one-off import scripts, not part of the app

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting. E501 is deliberately left
# out: the formatter owns line width and cannot split a long string or URL, so
# the handful of over-long lines here are ones no tool can fix.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]  # alembic configures logging before its imports

[tool.ruff.lint.isort]
# Tests import helpers from tests.conftest; keep those in their own trailing
# block rather than folded in with the volunteerdb imports they exercise.
known-local-folder = ["tests"]

[tool.coverage.run]
source = ["volunteerdb"]

[tool.coverage.report]
skip_covered = true
show_missing = true
